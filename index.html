<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ---------- Helpers ----------
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => (Math.round(n * 10) / 10).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtDate = (iso) => { if (!iso) return "–"; const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
const parseNum = (s) => { const v = parseFloat(String(s).replace(",", ".")); return isNaN(v) ? 0 : v; };
const dataHash = (d) => {
  const s = JSON.stringify({ ...d, backup: undefined });
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return String(h);
};
const parseLapSeconds = (str) => {
  if (!str) return null;
  const norm = String(str).replace(",", ".");
  const m = norm.match(/(?:(\d+):)?(\d+)\.(\d+)/);
  if (!m) { const n = parseFloat(norm); return isNaN(n) ? null : n; }
  const min = m[1] ? parseInt(m[1], 10) : 0;
  return min * 60 + parseFloat(m[2] + "." + m[3]);
};
const fmtLap = (str) => {
  const s = parseLapSeconds(str);
  if (s === null) return String(str || "–");
  const mm = Math.floor(s / 60);
  const ss = (s - mm * 60).toFixed(3);
  return mm > 0 ? `${mm}:${ss.padStart(6, "0")}` : `${ss}s`;
};
async function tryFetchJSON(url) {
  const wege = [url,
    "https://corsproxy.io/?url=" + encodeURIComponent(url),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url)];
  for (const u of wege) {
    try {
      const r = await fetch(u, { headers: { Accept: "application/json" } });
      if (r.ok) { try { return await r.json(); } catch { return null; } }
    } catch { /* nächster Weg */ }
  }
  return null;
}
function findeArrays(obj, tiefe) {
  // sucht rekursiv nach Arrays, deren Eintraege wie Sessions aussehen
  const out = [];
  if (!obj || typeof obj !== "object" || (tiefe || 0) > 6) return out;
  const wieSession = (e) => e && typeof e === "object" && (
    e.bestLap || e.BestLap || e.starttimeutc || e.startTimeUtc || e.start || e.startTime || e.sessionNr || e.sessionId
  );
  for (const k of Object.keys(obj)) {
    const v = obj[k];
    if (Array.isArray(v)) {
      if (v.length && v.some(wieSession)) out.push(v);
      for (const el of v) out.push(...findeArrays(el, (tiefe || 0) + 1));
    } else if (v && typeof v === "object") {
      out.push(...findeArrays(v, (tiefe || 0) + 1));
    }
  }
  return out;
}

function datumUhrzeitVon(e) {
  // Speedhive rechnet Zeiten auf die Zeitzone des Betrachters um - genauso machen wir es.
  if (!e) return null;
  const roh = e.dateTimeStart || e.datetimestart || e.DateTimeStart
    || e.starttimeutc || e.startTimeUtc || e.starttime || e.start || e.startTime;
  if (!roh) return null;
  let d = null;
  const n = Number(roh);
  if (!isNaN(n) && n > 0) {
    const ms = n > 1e14 ? n / 1000 : (n > 1e11 ? n : n * 1000);
    d = new Date(ms);
  } else {
    const t = Date.parse(String(roh));
    if (!isNaN(t)) d = new Date(t);
  }
  if (!d || isNaN(d.getTime())) return null;
  const zz = (x) => String(x).padStart(2, "0");
  return {
    datum: d.getFullYear() + "-" + zz(d.getMonth() + 1) + "-" + zz(d.getDate()),
    uhrzeit: zz(d.getHours()) + ":" + zz(d.getMinutes()),
  };
}

function zeitstempelVon(e) {
  if (!e) return 0;
  const roh = e.dateTimeStart || e.datetimestart || e.DateTimeStart
    || e.starttimeutc || e.startTimeUtc || e.starttime || e.start || e.startTime;
  if (!roh) return 0;
  const n = Number(roh);
  if (!isNaN(n) && n > 0) return n;
  const p = Date.parse(roh);
  return isNaN(p) ? 0 : p;
}

function sammleAktivitaeten(act) {
  // liefert alle bekannten Aktivitäten (id + Startzeit) aus dem Aktivitäts-Datensatz
  const dto = act.practiceSessionsDto || act.PracticeSessionsDto || {};
  const roh = dto.locations || dto.Locations || [];
  const liste = [];
  const rein = (x) => {
    if (!x || typeof x !== "object") return;
    if (x.id && (x.starttimeutc || x.startTimeUtc || x.starttime)) {
      liste.push({ id: x.id, ts: Number(x.starttimeutc || x.startTimeUtc || x.starttime) });
    }
    for (const k of Object.keys(x)) {
      const v = x[k];
      if (Array.isArray(v)) v.forEach(rein);
      else if (v && typeof v === "object") rein(v);
    }
  };
  (Array.isArray(roh) ? roh : [roh]).forEach(rein);
  return liste;
}

const utcZuDatum = (ts) => {
  const n = Number(ts);
  const ms = n > 1e14 ? n / 1000 : (n > 1e11 ? n : n * 1000);
  const d = new Date(ms);
  const zz = (x) => String(x).padStart(2, "0");
  return {
    datum: d.getFullYear() + "-" + zz(d.getMonth() + 1) + "-" + zz(d.getDate()),
    uhrzeit: zz(d.getHours()) + ":" + zz(d.getMinutes()),
    ms,
  };
};

async function speedhiveAbruf(worker, auto, modus) {
  const B = "https://practice-api.speedhive.com/api/v1/training";
  const hole = async (u) => {
    const r = await fetch(viaWorker(worker, u), { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("Status " + r.status);
    return await r.json();
  };
  const tx = String(auto.transponder || "").trim();
  const gespeichert = String(auto.activityId || "").trim();

  // Schritt 1: Einstiegs-Aktivitaet finden - erst per Transponder, sonst gespeicherte ID
  let erste = null;
  if (tx) {
    const suchen = [
      B + "/activities?chipCode=" + encodeURIComponent(tx) + "&count=5",
      B + "/chips/" + encodeURIComponent(tx) + "/activities?count=5",
      "https://practice-api.speedhive.com/api/v1/chips/" + encodeURIComponent(tx) + "/activities?count=5",
    ];
    for (const u of suchen) {
      try {
        const j = await hole(u);
        const liste = (j && (j.activities || j.items || j.data)) || (Array.isArray(j) ? j : []);
        if (liste && liste.length) {
          let neu = liste[0];
          for (const a of liste) {
            const t1 = Date.parse(a.startTime || a.start || 0) || Number(a.starttimeutc || 0);
            const t0 = Date.parse(neu.startTime || neu.start || 0) || Number(neu.starttimeutc || 0);
            if (t1 > t0) neu = a;
          }
          if (neu && neu.id) { erste = await hole(B + "/activities/" + neu.id); break; }
        }
      } catch (e) { /* naechster Versuch */ }
    }
  }
  if (!erste) {
    if (!gespeichert) throw new Error("keine Aktivitaet gefunden - bitte einmalig eine Speedhive-Adresse hinterlegen");
    erste = await hole(B + "/activities/" + gespeichert);
  }

  // Schritt 2: neueste Aktivitaet aus der Liste bestimmen
  const alle = sammleAktivitaeten(erste);
  let zielId = erste.id || gespeichert;
  let besteTs = 0;
  for (const a of alle) if (a.ts > besteTs) { besteTs = a.ts; zielId = a.id; }

  const detail = String(zielId) === String(erste.id) ? erste : await hole(B + "/activities/" + zielId);
  const sess = await hole(B + "/activities/" + zielId + "/sessions");

  const wann = detail.startTime || detail.StartTime || "";
  let datum = String(wann).slice(0, 10);
  let uhrzeit = String(wann).slice(11, 16);
  if (!datum && besteTs) { const u = utcZuDatum(besteTs); datum = u.datum; uhrzeit = u.uhrzeit; }
  const ort = (detail.location && (detail.location.name || detail.location.Name)) || "";

  const arraysAlle = findeArrays(sess, 0);

  if (modus === "tag") {
    const bl = sess.bestLap || sess.BestLap || {};
    const dauer = bl.duration || bl.Duration || (sess.stats && (sess.stats.fastestTime || sess.stats.FastestTime));
    if (!dauer) throw new Error("keine Tageszeit gefunden");
    const sid = bl.sessionId !== undefined ? bl.sessionId : bl.SessionId;
    let perId = null, perZeit = null;
    for (const arr of arraysAlle) {
      for (const e of arr) {
        if (!e || typeof e !== "object") continue;
        if (sid !== undefined && sid !== null) {
          const ids = [e.id, e.sessionId, e.sessionNr, e.number, e.nr];
          if (ids.some((x) => x !== undefined && String(x) === String(sid))) perId = perId || e;
        }
        const ebl = e.bestLap || e.BestLap || {};
        if (String(ebl.duration || ebl.Duration || "") === String(dauer)) perZeit = perZeit || e;
      }
    }
    const treffer = perId || perZeit;
    if (treffer) {
      const du = datumUhrzeitVon(treffer);
      if (du) { datum = du.datum; uhrzeit = du.uhrzeit; }
    }
    return { zeit: String(dauer), datum, uhrzeit, ort, quelle: "Tag", neueId: zielId };
  }

  const arrays = arraysAlle;
  let letzte = null, letzteTs = -1;
  for (const arr of arrays) {
    for (const e of arr) {
      const bl = e && (e.bestLap || e.BestLap);
      if (!bl || !(bl.duration || bl.Duration)) continue;
      const ts = zeitstempelVon(e);
      if (ts >= letzteTs) { letzteTs = ts; letzte = e; }
    }
  }
  if (!letzte) throw new Error("keine Session gefunden");
  const bl2 = letzte.bestLap || letzte.BestLap || {};
  const dauer2 = bl2.duration || bl2.Duration;
  if (!dauer2) throw new Error("keine Session-Zeit gefunden");
  const duL = datumUhrzeitVon(letzte);
  if (duL) { datum = duL.datum; uhrzeit = duL.uhrzeit; }
  return { zeit: String(dauer2), datum, uhrzeit, ort, quelle: "letzte Session", neueId: zielId };
}

function getStandort() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 8000, maximumAge: 300000 }
    );
  });
}
async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=de");
    const j = await r.json();
    return j.city || j.locality || j.principalSubdivision || null;
  } catch { return null; }
}
async function fetchTemperaturVonKoordinaten(lat, lon, datum, uhrzeit) {
  try {
    const hourStr = (uhrzeit || "12:00").slice(0, 2) + ":00";
    const base = "&latitude=" + lat + "&longitude=" + lon + "&start_date=" + datum + "&end_date=" + datum + "&hourly=temperature_2m&timezone=auto";
    let wj = await (await fetch("https://api.open-meteo.com/v1/forecast?x=1" + base)).json();
    let times = wj.hourly && wj.hourly.time;
    if (!times || !times.length) {
      wj = await (await fetch("https://archive-api.open-meteo.com/v1/archive?x=1" + base)).json();
      times = wj.hourly && wj.hourly.time;
    }
    if (!times) return null;
    const idx = times.findIndex((t) => t.startsWith(datum + "T" + hourStr));
    return idx >= 0 ? wj.hourly.temperature_2m[idx] : null;
  } catch { return null; }
}
async function fetchTemperature(ort, datum, uhrzeit) {
  try {
    const geo = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(ort) + "&count=1&language=de");
    const gj = await geo.json();
    const g0 = gj && gj.results && gj.results[0];
    if (!g0) return null;
    const hourStr = (uhrzeit || "12:00").slice(0, 2) + ":00";
    const base = "&latitude=" + g0.latitude + "&longitude=" + g0.longitude + "&start_date=" + datum + "&end_date=" + datum + "&hourly=temperature_2m&timezone=auto";
    let wj = await (await fetch("https://api.open-meteo.com/v1/forecast?x=1" + base)).json();
    let times = wj.hourly && wj.hourly.time;
    if (!times || !times.length) {
      wj = await (await fetch("https://archive-api.open-meteo.com/v1/archive?x=1" + base)).json();
      times = wj.hourly && wj.hourly.time;
    }
    if (!times) return null;
    const idx = times.findIndex((t) => t.startsWith(datum + "T" + hourStr));
    return idx >= 0 ? wj.hourly.temperature_2m[idx] : null;
  } catch { return null; }
}

function migriereSpecs(alt) {
  // Uebernimmt Werte aus der alten flachen Struktur in die neuen Gruppen.
  const a = alt || {};
  if (a._migriert) return a;
  const n = { ...a, _migriert: true };
  const setze = (ziel, wert) => { if (wert && !n[ziel]) n[ziel] = wert; };
  setze("gehaeuse_notiz", a.gehaeuse);
  setze("buchse_notiz", a.buchse);
  setze("kolben_notiz", a.kolben);
  setze("welle_steuerzeiten", a.welle);
  if (a.vergaser && !n.brennraum_notiz) n.brennraum_notiz = "Vergaser: " + a.vergaser;
  return n;
}


const seedData = () => ({
  activeAutoId: null,
  backup: { lastBackupAt: null, intervalDays: 30, hash: "" },
  autos: [],
  motoren: [],
  fahrten: [],
  settings: {
    fv: { max: 12, gelb: 3 }, fg1: { max: 8, gelb: 2 },
    hl: { max: 5, gelb: 1 }, fl: { max: 5, gelb: 1 }, pl: { max: 5, gelb: 1 },
    kz: { max: 4, gelb: 1 },
  },
  pruef: { kerze: 1, kruemmer: 2 },
});

const KZ_DEFAULT = () => ({ reset: "2020-01-01", start: 0, note: "", checkedAt: 0 });
const normalizeData = (d) => {
  const base = seedData();
  const out = { ...base, ...d };
  out.settings = { ...base.settings, ...(d.settings || {}) };
  out.pruef = { ...base.pruef, ...(d.pruef || {}) };
  const f = d.fahrten || [];
  const summe = (feld, id, abDatum) => f
    .filter((x) => x[feld] === id && (!abDatum || x.datum >= abDatum))
    .reduce((sum, x) => sum + (x.liter || 0), 0);
  const migPart = (part, feld, id) => {
    const pt = part || { reset: today(), start: 0 };
    if (pt.stand !== undefined) return pt;
    return { ...pt, stand: Math.round(((pt.start || 0) + summe(feld, id, pt.reset)) * 1000) / 1000 };
  };
  out.autos = (d.autos || []).map((a) => ({
    ...a,
    gesamt: a.gesamt !== undefined ? a.gesamt : Math.round(((a.startAuto || 0) + summe("autoId", a.id, null)) * 1000) / 1000,
    fv: migPart(a.fv, "autoId", a.id),
    fg1: migPart(a.fg1, "autoId", a.id),
  }));
  out.motoren = (d.motoren || []).map((m) => ({
    ...m,
    specs: migriereSpecs(m.specs),
    motor: migPart(m.motor, "motorId", m.id),
    hl: migPart(m.hl, "motorId", m.id),
    fl: migPart(m.fl, "motorId", m.id),
    pl: migPart(m.pl, "motorId", m.id),
    kz: migPart(m.kz || KZ_DEFAULT(), "motorId", m.id),
  }));
  return out;
};

  const rest = cfg.max - stand;

  if (rest <= cfg.gelb) return { key: "gelb", label: "BALD FÄLLIG", rest };
  return { key: "grün", label: "OK", rest };
};

    const t = setTimeout(() => setArmed(false), 4000);

    <button onClick={() => { if (armed) { setArmed(false); onConfirm(); } else { setArmed(true); } }}

      {armed ? confirmLabel : label}
    </button>
  );
}

function TeilIcon({ art }) {
  const b = TEIL_BILDER[art];
  if (!b) return null;
  return <img src={"data:image/png;base64," + b} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0 border border-slate-700/60" />;
}

function SetupGruppe({ icon, titel, felder, specs, onChange, offen, umschalten }) {
  const gefuellt = felder.filter(([art, key]) => {
    const w = specs[key];
    return art === "check" ? w === true : (w !== undefined && w !== null && String(w).trim() !== "");
  }).length;
  return (
    <div className="mb-2">
      <button onClick={umschalten}
        className={`w-full flex items-center gap-3 rounded-xl border p-3.5 text-left active:bg-slate-800 ${offen ? "bg-slate-950 border-amber-400/60" : "bg-slate-950/60 border-slate-700/60"}`}>
        <TeilIcon art={icon} />
        <span className="flex-1">
          <span className="block font-bold text-slate-100 text-base">{titel}</span>
          <span className="block text-xs text-slate-400">{gefuellt > 0 ? gefuellt + " von " + felder.length + " ausgefüllt" : "noch nichts eingetragen"}</span>
        </span>
        <span className={`text-lg ${offen ? "text-amber-300" : "text-slate-500"}`}>{offen ? "▲" : "▼"}</span>
      </button>
      {offen && (
        <div className="border border-slate-700/60 border-t-0 rounded-b-xl p-3 -mt-1">
          {felder.map((f) => {
            const [art, key, label, optionen] = f;
            if (art === "check") {
              const an = specs[key] === true;
              return (
                <div key={key} className="flex items-center justify-between gap-2 mb-2">
                  <span className="text-base text-slate-200">{label}</span>
                  <button onClick={() => onChange({ ...specs, [key]: !an })}
                    className={`shrink-0 text-sm font-bold rounded-full px-5 py-2 border ${an ? "bg-emerald-500/20 text-emerald-300 border-emerald-400/50" : "bg-slate-800 text-slate-400 border-slate-600"}`}>
                    {an ? "✓ Ja" : "Nein"}
                  </button>
                </div>
              );
            }
            if (art === "wahl") {
              return (
                <div key={key} className="mb-2">
                  <span className="block text-sm text-slate-300 mb-1">{label}</span>
                  <div className="flex gap-2">
                    {optionen.map((o) => (
                      <button key={o} onClick={() => onChange({ ...specs, [key]: specs[key] === o ? "" : o })}
                        className={`flex-1 text-sm font-bold rounded-xl py-2.5 border ${specs[key] === o ? "bg-amber-400 text-slate-950 border-amber-400" : "bg-slate-800 text-slate-300 border-slate-600"}`}>{o}</button>
                    ))}
                  </div>
                </div>
              );
            }
            if (art === "notiz") {
              return (
                <label key={key} className="block text-sm text-slate-300 mb-2">{label}
                  <textarea rows={2} className={`${inputCls} mt-1`} value={specs[key] || ""}
                    onChange={(e) => onChange({ ...specs, [key]: e.target.value })} />
                </label>
              );
            }
            return (
              <label key={key} className="block text-sm text-slate-300 mb-2">{label}
                <input className={`${inputCls} mt-1`} value={specs[key] || ""}
                  onChange={(e) => onChange({ ...specs, [key]: e.target.value })} />
              </label>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PartEditor({ title, part, onChange, withNote, stand, cfg, pruefIntervall }) {
  const [open, setOpen] = useState(false);
  const history = part.history || [];
  const seitPruefung = pruefIntervall && stand !== undefined ? stand - (part.checkedAt || 0) : 0;
  const pruefungFaellig = pruefIntervall && seitPruefung >= pruefIntervall;
  return (
    <div className="border border-slate-700/60 rounded-xl p-3 mb-3">
      <div className="flex items-center justify-between mb-2">
        <span className="font-semibold text-slate-100">{title}</span>
        <button onClick={() => onChange({ ...part, reset: today(), start: 0, stand: 0, checkedAt: 0,
            history: [...history, { note: part.note || "", liter: stand !== undefined ? Math.round(stand * 10) / 10 : null, bis: today() }] })}
          className="text-xs font-bold text-amber-300 border border-amber-400 rounded-full px-3 py-1 active:bg-amber-400/10">Teil getauscht → 0</button>
      </div>
      {cfg && stand !== undefined && <TankBar name="" note={part.note} stand={stand} cfg={cfg} />}
      {pruefungFaellig && (
        <div className="bg-amber-400/10 border border-amber-400/40 rounded-xl p-2 my-2 flex items-center justify-between gap-2">
          <span className="text-xs font-semibold text-amber-200">🔍 {title} prüfen – {fmt(seitPruefung)} L seit letzter Prüfung</span>
          <button onClick={() => onChange({ ...part, checkedAt: stand })}
            className="shrink-0 text-xs font-bold rounded-full bg-amber-400 text-slate-950 px-3 py-1 active:bg-amber-300">Geprüft ✓</button>
        </div>
      )}
      <div className="grid grid-cols-2 gap-2">
        <label className="text-xs text-slate-400">Reset am
          <input type="date" className={`${inputCls} mt-1`} value={part.reset} onChange={(e) => onChange({ ...part, reset: e.target.value })} />
        </label>
        <label className="text-xs font-bold text-amber-300">Stand [L]
          <input inputMode="decimal" className={`${inputCls} mt-1 font-extrabold text-amber-300 text-lg`}
            defaultValue={String(standOf(part)).replace(".", ",")}
            key={`${part.reset}-${title}-${standOf(part)}`}
            onBlur={(e) => onChange({ ...part, stand: parseNum(e.target.value) })} />
        </label>
      </div>
      {withNote && (
        <label className="block text-xs text-slate-400 mt-2">Notiz (z. B. Hersteller)
          <input className={`${inputCls} mt-1`} placeholder="z. B. O.S Lager" value={part.note || ""}
            onChange={(e) => onChange({ ...part, note: e.target.value })} />
        </label>
      )}
      {history.length > 0 && (
        <div className="mt-2">
          <button onClick={() => setOpen((v) => !v)} className="text-xs font-bold text-slate-300 active:text-amber-300">
            📜 Historie ({history.length}) {open ? "▲" : "▼"}
          </button>
          {open && (
            <div className="mt-1 space-y-1">
              {[...history].reverse().map((h, i) => (
                <div key={i} className="text-xs text-slate-400 tabular-nums border-l-2 border-slate-700 pl-2">
                  {h.note || "Ohne Notiz"} – {h.liter !== null && h.liter !== undefined ? `${fmt(h.liter)} L` : "? L"} · ausgebaut {fmtDate(h.bis)}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---------- Screens ----------
function DashboardScreen({ autos, motoren, fahrten, settings, setTab, activeAutoId, up, fullData, doBackup }) {

  const shownAutos = activeAuto ? [activeAuto] : [];
  const shownMotoren = activeMotor ? [activeMotor] : [];
  const bk = fullData.backup || {};
  const interval = bk.intervalDays === undefined ? 30 : bk.intervalDays;
  const changed = dataHash(fullData) !== (bk.hash || "");
  const daysSince = bk.lastBackupAt ? Math.floor((Date.now() - new Date(bk.lastBackupAt).getTime()) / 86400000) : null;
  const showReminder = interval > 0 && changed && (daysSince === null || daysSince >= interval);

    <div className="space-y-4">

          <select className="rounded-xl border border-slate-600 px-2 py-1 text-sm bg-slate-800 text-slate-100" value={activeAuto?.id || ""}

          <select className="rounded-xl border border-slate-600 px-2 py-1 text-sm bg-slate-800 text-slate-100" value={activeAuto.motorId || ""}
            onChange={(e) => up((d) => ({ autos: d.autos.map((a) => a.id === activeAuto.id ? { ...a, motorId: e.target.value } : a) }))}>

          )}

      )}
      {shownMotoren.map((m) => {
        const s = motorStands(m);
        const kz = m.kz || KZ_DEFAULT();
        const parts = [
          ["Hauptlager", s.hl, settings.hl, m.hl.note], ["Frontlager", s.fl, settings.fl, m.fl.note], ["Pleuel", s.pl, settings.pl, m.pl.note],
          ["Kerze", s.kz, settings.kz, kz.note],
        ];
        const kzCheck = s.kz - (kz.checkedAt || 0);
        const next = parts.map(([n, st, c]) => ({ n, ...statusOf(st, c) })).sort((a, b) => a.rest - b.rest)[0];
        return (
          <Card key={m.id}>
            <div className="flex items-baseline justify-between">
              <span className="text-lg font-extrabold text-slate-100">{m.name}</span>
              <span className="text-2xl font-extrabold text-amber-300 tabular-nums">{fmt(s.gesamt)} L</span>
            </div>
            {parts.map(([n, st, c, note]) => <TankBar key={n} name={n} note={note} stand={st} cfg={c} />)}
            <div className="mt-2 text-sm font-semibold text-slate-200">
              {next.rest <= 0 ? "⚠️ JETZT fällig: " : "Nächste Wartung: "}{next.n}
              {next.rest > 0 ? ` in ${fmt(next.rest)} L` : ""}
            </div>
          </Card>
        );
      })}

      {shownMotoren.map((m) => {
        const s = motorStands(m);
        const kz = m.kz || KZ_DEFAULT();
        const ivKerze = (fullData.pruef && fullData.pruef.kerze) || 1;
        const ivKruemmer = (fullData.pruef && fullData.pruef.kruemmer) || 2;
        const kzCheck = s.kz - (kz.checkedAt || 0);
        const kdCheck = s.gesamt - (m.kdCheckedAt || 0);
        const offen = [];
        if (kzCheck >= ivKerze) offen.push({
          key: "kerze", text: "Kerze prüfen", seit: kzCheck,
          quittieren: () => up((d) => ({ motoren: d.motoren.map((x) => x.id === m.id ? { ...x, kz: { ...(x.kz || KZ_DEFAULT()), checkedAt: s.kz } } : x) })),
        });
        if (kdCheck >= ivKruemmer) offen.push({
          key: "kruemmer", text: "Krümmerdichtung sichtprüfen", seit: kdCheck,
          quittieren: () => up((d) => ({ motoren: d.motoren.map((x) => x.id === m.id ? { ...x, kdCheckedAt: s.gesamt } : x) })),
        });
        if (!offen.length) return null;
        return (
          <div key={"pruef-" + m.id} className="space-y-2">
            <h2 className="text-sm font-bold uppercase tracking-widest text-amber-400">Sichtprüfungen</h2>
            {offen.map((o) => (
              <div key={o.key} className="bg-amber-400/10 border border-amber-400/40 rounded-2xl p-3 flex items-center justify-between gap-3">
                <div>
                  <div className="text-sm font-bold text-amber-200">🔍 {o.text}</div>
                  <div className="text-xs text-slate-300 tabular-nums">{fmt(o.seit)} L seit letzter Prüfung</div>
                </div>
                <button onClick={o.quittieren}
                  className="shrink-0 text-sm font-bold rounded-xl bg-amber-400 text-slate-950 px-4 py-2 active:bg-amber-300">Geprüft ✓</button>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

  const auto = autos.find((a) => a.id === autoId);
  const [motorId, setMotorId] = useState(auto?.motorId || motoren[0]?.id || "");
  const [liter, setLiter] = useState("");
  const [notiz, setNotiz] = useState("");

    return (
      <Card className="text-sm text-slate-300 space-y-2">
        <p className="font-bold text-slate-100">Bevor Du Fahrten eintragen kannst:</p>
        {motoren.length === 0 && <button onClick={() => setTab("motoren")} className="block font-bold text-amber-300 underline">1. Motor anlegen →</button>}
        {autos.length === 0 && <button onClick={() => setTab("autos")} className="block font-bold text-amber-300 underline">{motoren.length === 0 ? "2." : "1."} Auto anlegen →</button>}
      </Card>

    const l = parseNum(liter);

    const uhrzeit = new Date().toTimeString().slice(0, 5);
    up((d) => ({
      fahrten: [...d.fahrten, { id: uid(), datum, uhrzeit, autoId, motorId, liter: l, notiz, ts: Date.now() }],
      autos: d.autos.map((a) => a.id !== autoId ? a : ({
        ...a,
        gesamt: Math.round(((a.gesamt || 0) + l) * 1000) / 1000,
        fv: plus(a.fv, l),
        fg1: plus(a.fg1, l),
      })),
      motoren: d.motoren.map((m) => m.id !== motorId ? m : ({
        ...m,
        motor: plus(m.motor, l),
        hl: plus(m.hl, l),
        fl: plus(m.fl, l),
        pl: plus(m.pl, l),
        kz: plus(m.kz || KZ_DEFAULT(), l),

    <div className="space-y-4">
      <Card>
        <h2 className="text-lg font-extrabold text-slate-100 mb-3">Fahrt eintragen</h2>

        <Field label="Auto">

            {autos.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        </Field>
        <Field label="Motor">
          <select className={inputCls} value={motorId} onChange={(e) => setMotorId(e.target.value)}>
            {motoren.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </Field>
        <Field label="Laufleistung [L]">
          <input inputMode="decimal" placeholder="z. B. 0,5" className={inputCls} value={liter} onChange={(e) => setLiter(e.target.value)} />
        </Field>
        <div className="flex gap-2 mb-3">
          {[0.25, 0.5, 1].map((v) => (

            <div className="text-xs text-slate-400">

function MotorenScreen({ motoren, fahrten, settings, up, editMotorId, setEditMotorId, activeMotorId, autos }) {
  const motor = motoren.find((m) => m.id === editMotorId);
  const setMotor = (patch) => up((d) => ({ motoren: d.motoren.map((m) => (m.id === editMotorId ? { ...m, ...patch } : m)) }));
  const [lapMsg, setLapMsg] = useState("");
  const [lapBusy, setLapBusy] = useState(false);
  const [pendingLap, setPendingLap] = useState(null);
  const [editLapId, setEditLapId] = useState(null);
  const [setupOffen, setSetupOffen] = useState("");
  const [manuellOffen, setManuellOffen] = useState(false);
  const [manZeit, setManZeit] = useState("");
  const [manDatum, setManDatum] = useState(today());
  const [manUhrzeit, setManUhrzeit] = useState(new Date().toTimeString().slice(0, 5));
  const [manLink, setManLink] = useState("");
  const montiertesAuto = motor ? autos.find((a) => a.motorId === motor.id) : null;
  const ermittleWetterUndSetzePending = async (zeit, datum, uhrzeit, ortHint) => {
    let temp = null;
    let ortName = ortHint || (montiertesAuto && montiertesAuto.ort) || "";
    if (ortHint) {
      // Strecke aus Speedhive: Temperatur fuer die Strecke holen, nicht fuer den aktuellen Standort
      setLapMsg("Hole Temperatur für " + ortHint + " …");
      temp = await fetchTemperature(ortHint, datum, uhrzeit);
      if (temp === null) {
        const sauber = String(ortHint).replace(/^(MC|AMC|RC|MSC|AC)[\s.-]+/i, "").trim();
        if (sauber && sauber !== ortHint) temp = await fetchTemperature(sauber, datum, uhrzeit);
      }
      if (temp === null && montiertesAuto && montiertesAuto.ort) {
        temp = await fetchTemperature(montiertesAuto.ort, datum, uhrzeit);
      }
    } else {
      setLapMsg("Ermittle deinen Standort für die Temperatur …");
      const standort = await getStandort();
      if (standort) {
        temp = await fetchTemperaturVonKoordinaten(standort.lat, standort.lon, datum, uhrzeit);
        const rg = await reverseGeocode(standort.lat, standort.lon);
        if (rg) ortName = rg;
      } else if (montiertesAuto && montiertesAuto.ort) {
        temp = await fetchTemperature(montiertesAuto.ort, datum, uhrzeit);
      }
    }
    setPendingLap({ zeit, datum, uhrzeit, ort: ortName, temperatur: temp, link: manLink || "" });
    setLapMsg(temp === null ? "⚠️ Temperatur konnte nicht ermittelt werden – du kannst sie im Eintrag nachtragen." : "");
    setLapBusy(false);
  };
  const holeVonSpeedhive = async (modus) => {
    if (!montiertesAuto || (!montiertesAuto.transponder && !montiertesAuto.activityId)) {
      setLapMsg("Bitte das Auto zuerst unter 'Autos' mit Speedhive verknüpfen.");
      return;
    }
    setLapBusy(true);
    setLapMsg(modus === "tag" ? "Hole schnellste Runde des Tages …" : "Hole schnellste Runde der letzten Session …");
    try {
      const res = await speedhiveAbruf(WORKER_STANDARD, montiertesAuto, modus);
      if (res.neueId && String(res.neueId) !== String(montiertesAuto.activityId || "")) {
        up((d) => ({ autos: d.autos.map((a) => a.id === montiertesAuto.id ? { ...a, activityId: String(res.neueId) } : a) }));
      }
      setLapMsg("Gefunden (" + res.quelle + "): " + res.zeit + " – ermittle Temperatur …");
      await ermittleWetterUndSetzePending(res.zeit, res.datum, res.uhrzeit, res.ort);
    } catch (e) {
      setLapMsg("❌ Abruf fehlgeschlagen. Ist das Auto unter 'Autos' mit Speedhive verknüpft? Sonst die Zeit oben manuell eintragen.");
      setLapBusy(false);
    }
  };
  const uebernehmeManuell = async () => {
    if (!manZeit.trim()) { setLapMsg("Bitte zuerst eine Zeit eintragen."); return; }
    setLapBusy(true);
    setLapMsg("Übernehme manuelle Zeit …");
    await ermittleWetterUndSetzePending(manZeit.trim(), manDatum, manUhrzeit, null);
    setManZeit("");
  };
  const findeSchnellste = (text) => {
    const treffer = String(text).match(/\b(?:\d+:)?\d{1,2}[.,]\d{2,3}\b/g) || [];
    const zeiten = treffer
      .map((t) => ({ roh: t.replace(",", "."), sek: parseLapSeconds(t.replace(",", ".")) }))
      .filter((z) => z.sek !== null && z.sek > 1 && z.sek < 600);
    if (!zeiten.length) return null;
    return zeiten.reduce((a, b) => (b.sek < a.sek ? b : a));
  };
  const ausZwischenablage = async () => {
    try {
      const text = await navigator.clipboard.readText();
      const linkTreffer = String(text).match(/https?:\/\/\S*speedhive\S*/);
      const beste = findeSchnellste(text);
      if (!beste) {
        if (linkTreffer) {
          setManLink(linkTreffer[0]);
          setLapMsg("Speedhive-Link übernommen. Trage die Zeit oben ein – der Link wird mitgespeichert.");
        } else {
          setLapMsg("In der Zwischenablage wurde keine Rundenzeit gefunden.");
        }
        return;
      }
      if (linkTreffer) setManLink(linkTreffer[0]);
      const gefunden = (String(text).match(/\b(?:\d+:)?\d{1,2}[.,]\d{2,3}\b/g) || []).length;
      setLapBusy(true);
      setLapMsg("Schnellste von " + gefunden + " gefundenen Zeiten: " + beste.roh + " – ermittle Standort …");
      await ermittleWetterUndSetzePending(beste.roh, today(), new Date().toTimeString().slice(0, 5), null);
    } catch (e) {
      setLapMsg("Zwischenablage konnte nicht gelesen werden. Nutze bitte die manuelle Eingabe.");
    }
  };
  const speichereGrip = (grip) => {
    if (!pendingLap) return;
    const entry = { id: uid(), ...pendingLap, grip };
    setMotor({ rundenzeiten: [...(motor.rundenzeiten || []), entry] });
    setPendingLap(null);
    setManLink("");
    setLapMsg("✓ Bestzeit gespeichert!");
    setTimeout(() => setLapMsg(""), 3000);
  };
  if (motor) {
    const s = motorStands(motor);
    const rundenzeiten = motor.rundenzeiten || [];
    const sortiert = [...rundenzeiten].sort((a, b) => (parseLapSeconds(a.zeit) ?? 9e9) - (parseLapSeconds(b.zeit) ?? 9e9));
    return (
      <div className="space-y-4">
        <button onClick={() => setEditMotorId(null)} className="text-amber-300 font-semibold text-sm">← Zurück zur Liste</button>
        <Card>
          <Field label="Motor-Name">
            <input className={`${inputCls} font-extrabold`} value={motor.name} onChange={(e) => setMotor({ name: e.target.value })} />
          </Field>
          <div className="bg-amber-400/10 border border-amber-400/40 rounded-xl px-3 py-2 mb-3 flex items-baseline justify-between">
            <span className="text-xs font-bold uppercase tracking-wide text-amber-200">Motor gesamt</span>
            <span className="text-2xl font-extrabold text-amber-300 tabular-nums">{fmt(s.gesamt)} L</span>
          </div>
          <PartEditor title="Motor gesamt" part={motor.motor} onChange={(p) => setMotor({ motor: p })} />
          <PartEditor title="Hauptlager" part={motor.hl} onChange={(p) => setMotor({ hl: p })} withNote stand={s.hl} cfg={settings.hl} />
          <PartEditor title="Frontlager" part={motor.fl} onChange={(p) => setMotor({ fl: p })} withNote stand={s.fl} cfg={settings.fl} />
          <PartEditor title="Pleuel" part={motor.pl} onChange={(p) => setMotor({ pl: p })} withNote stand={s.pl} cfg={settings.pl} />
          <PartEditor title="Kerze" part={motor.kz || KZ_DEFAULT()} onChange={(p) => setMotor({ kz: p })} withNote stand={s.kz} cfg={settings.kz} pruefIntervall={1} />
        </Card>
        <Card>
          <h3 className="font-bold text-slate-100 mb-3">Setup & Notizen</h3>
          {SETUP_GRUPPEN.map(([gk, icon, titel, felder]) => (
            <SetupGruppe key={gk} icon={icon} titel={titel} felder={felder}
              specs={motor.specs || {}} onChange={(neueSpecs) => setMotor({ specs: neueSpecs })}
              offen={setupOffen === gk} umschalten={() => setSetupOffen(setupOffen === gk ? "" : gk)} />
          ))}
          <Field label="Allgemeine Notizen"><textarea rows={2} className={inputCls} value={motor.notizen} onChange={(e) => setMotor({ notizen: e.target.value })} /></Field>
        </Card>
        <Card>

function RanglisteScreen({ motoren }) {
  const liste = motoren
    .map((m) => {
      const rz = m.rundenzeiten || [];
      let beste = null;
      for (const r of rz) {
        const sek = parseLapSeconds(r.zeit);
        if (sek !== null && (beste === null || sek < parseLapSeconds(beste.zeit))) beste = r;
      }
      return { m, ts: parseNum(m.topspeed), dz: parseNum(m.durchzug), beste, anzahl: rz.length };
    })
    .sort((a, b) => {
      // 1. Topspeed, 2. Durchzug, 3. Rundenzeit
      if (b.ts !== a.ts) return b.ts - a.ts;
      if (b.dz !== a.dz) return b.dz - a.dz;
      const sa = a.beste ? parseLapSeconds(a.beste.zeit) : null;
      const sb = b.beste ? parseLapSeconds(b.beste.zeit) : null;
      if (sa !== null && sb !== null) return sa - sb;
      if (sa !== null) return -1;
      if (sb !== null) return 1;
      return 0;
    });
  return (
    <div className="space-y-3">
      <Card className="py-2">
        <p className="text-xs text-slate-300">Reihenfolge: <span className="font-bold text-amber-300">1. Topspeed</span> → <span className="font-bold text-amber-300">2. Durchzug</span> → <span className="font-bold text-amber-300">3. Bestzeit</span></p>
      </Card>
      {liste.length === 0 && <Card className="text-sm text-slate-400">Noch keine Motoren angelegt.</Card>}
      {liste.map((r, i) => (
        <Card key={r.m.id}>
          <div className="flex items-center gap-3 mb-3">
            <span className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center text-lg font-extrabold ${i === 0 ? "bg-amber-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>{i + 1}</span>
            <div className="flex-1">
              <div className="text-lg font-extrabold text-slate-100">{r.m.name}</div>
              <div className="text-xs text-slate-400">{r.anzahl > 0 ? r.anzahl + " Rundenzeit(en) erfasst" : "keine Rundenzeit"}</div>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2 mb-2">
            <div className="bg-amber-400/10 border border-amber-400/40 rounded-xl px-3 py-2">
              <div className="text-[11px] font-bold uppercase tracking-wide text-amber-200">Topspeed</div>
              <div className="text-2xl font-extrabold text-amber-300 tabular-nums">{r.m.topspeed ? r.m.topspeed : "–"}<span className="text-sm font-bold"> km/h</span></div>
            </div>
            <div className="bg-amber-400/10 border border-amber-400/40 rounded-xl px-3 py-2">
              <div className="text-[11px] font-bold uppercase tracking-wide text-amber-200">Durchzug</div>
              <div className="text-2xl font-extrabold text-amber-300 tabular-nums">{r.m.durchzug ? r.m.durchzug : "–"}<span className="text-sm font-bold"> km/h</span></div>
            </div>
          </div>
          {r.beste ? (
            <div className="border-t border-slate-700/60 pt-2">
              <div className="text-base font-extrabold text-slate-100 tabular-nums">🏁 {fmtLap(r.beste.zeit)}</div>
              <div className="text-sm text-slate-300">{fmtDate(r.beste.datum)}{r.beste.uhrzeit ? " " + r.beste.uhrzeit : ""} · {r.beste.ort || "Ort unbekannt"}</div>
              <div className="text-sm text-slate-300">🌡️ {r.beste.temperatur !== null && r.beste.temperatur !== undefined ? Math.round(r.beste.temperatur) + "°C" : "–"} · 🚦 Grip: {r.beste.grip || "–"}</div>
              {r.beste.notiz && <div className="text-sm text-slate-400">📝 {r.beste.notiz}</div>}
            </div>
          ) : (
            <div className="border-t border-slate-700/60 pt-2 text-sm text-slate-400">🏁 Noch keine Rundenzeit erfasst</div>
          )}
        </Card>
      ))}
      <p className="text-xs text-slate-400 px-1">Topspeed und Durchzug sind mit der Radarpistole an derselben Stelle gemessen und daher gut vergleichbar. Die Bestzeit dient als dritter Vergleichswert – sie hängt zusätzlich von Grip und Setup ab.</p>
    </div>
  );
}

          <button onClick={() => setAutoPlay(!autoPlay)} className="text-xs font-bold text-amber-300 border border-amber-400 rounded-full px-3 py-1">

          <div className="h-full bg-amber-400 rounded-full" style={{ width: ((i + 1) / TOUR.length) * 100 + "%", transition: "width .5s" }} />
        </div>
        <div className="text-center mb-3">
          <div className="text-5xl mb-2">{s.icon}</div>
          <h3 className="text-lg font-extrabold text-slate-100 mb-1">{s.titel}</h3>
          <p className="text-sm text-slate-300">{s.text}</p>
        </div>
        <TourDemo art={s.demo} />
        <div className="flex gap-2 mt-4">
          <button onClick={() => { setAutoPlay(false); setI(Math.max(0, i - 1)); }} disabled={i === 0}
            className="flex-1 rounded-xl border border-slate-600 text-slate-300 font-semibold py-2.5 text-sm disabled:opacity-30">← Zurück</button>
          {i + 1 < TOUR.length ? (
            <button onClick={() => { setAutoPlay(false); setI(i + 1); }}
              className="flex-1 rounded-xl bg-amber-400 text-slate-950 font-bold py-2.5 text-sm active:bg-amber-300">Weiter →</button>
          ) : (
            <button onClick={onClose} className="flex-1 rounded-xl bg-amber-400 text-slate-950 font-bold py-2.5 text-sm active:bg-amber-300">Los geht's! 🏁</button>
          )}
        </div>
      </Card>
    </div>
  );
}

function SettingsScreen({ autos, motoren, settings, up, onResetAll, activeAutoId, fullData, onRestore, doBackup, onTour, imGast, gastName, onGastLaden, onGastBeenden }) {
  const [showBackup, setShowBackup] = useState(false);
  const [offen, setOffen] = useState("");
  const [gastText, setGastText] = useState("");
  const [gastMsg, setGastMsg] = useState("");
  const [restoreText, setRestoreText] = useState("");
  const [backupMsg, setBackupMsg] = useState("");
  const backupString = JSON.stringify(fullData);
  const copyBackup = async () => {
    try {
      await navigator.clipboard.writeText(backupString);
      setBackupMsg("✓ In die Zwischenablage kopiert!");
    } catch {
      setBackupMsg("Kopieren nicht möglich – bitte Text unten manuell markieren und kopieren.");
    }
    setTimeout(() => setBackupMsg(""), 4000);
  };
  const [restoreArmed, setRestoreArmed] = useState(false);
  const doRestore = () => {
    const cleaned = restoreText.split(String.fromCharCode(96)).join("").trim();
    const startIdx = cleaned.indexOf("{");
    const endIdx = cleaned.lastIndexOf("}");
    if (!cleaned || startIdx === -1 || endIdx === -1) {
      setBackupMsg("Bitte zuerst den Sicherungstext in das Feld einfügen.");
      setTimeout(() => setBackupMsg(""), 4000);
      return;
    }
    try {
      const parsed = JSON.parse(cleaned.slice(startIdx, endIdx + 1));
      if (!parsed || !Array.isArray(parsed.autos) || !Array.isArray(parsed.motoren) || !Array.isArray(parsed.fahrten) || typeof parsed.settings !== "object") {
        throw new Error("ungültig");
      }
      if (!restoreArmed) {
        setRestoreArmed(true);
        setBackupMsg("⚠️ Sicherung gültig! Nochmal ‚Jetzt überschreiben' tippen zum Bestätigen.");
        setTimeout(() => { setBackupMsg(""); setRestoreArmed(false); }, 6000);
        return;
      }
      onRestore(parsed);
      setRestoreText("");
      setRestoreArmed(false);
      setBackupMsg("✓ Daten wiederhergestellt!");
      setTimeout(() => setBackupMsg(""), 4000);
    } catch {
      setRestoreArmed(false);
      setBackupMsg("Das sieht nicht wie eine gültige Sicherung aus – bitte den kompletten Text einfügen.");
      setTimeout(() => setBackupMsg(""), 5000);
    }
  };
  const bereiche = imGast
    ? [
        ["profil", "👤", "Profile", "Gast-Ansicht beenden"],
        ["tour", "🎬", "Einführung", "Kurze Tour durch alle Funktionen"],
      ]
    : [
        ["profil", "👤", "Profile", "Daten eines Freundes ansehen"],
        ["maxwerte", "🚦", "Wechselintervalle", "Wann Bauteile fällig werden"],
        ["sicht", "🔍", "Sichtprüfungen", "Kerze und Krümmerdichtung"],
        ["sicherung", "💾", "Datensicherung", "Sichern und wiederherstellen"],
        ["tour", "🎬", "Einführung", "Kurze Tour durch alle Funktionen"],
      ];

  return (
    <div className="space-y-3">
      {bereiche.map(([key, icon, titel, unter]) => (
        <div key={key}>
          <button onClick={() => setOffen(offen === key ? "" : key)}
            className={`w-full flex items-center gap-3 rounded-2xl border p-4 text-left active:bg-slate-800 ${offen === key ? "bg-slate-900 border-amber-400/60" : "bg-slate-900 border-slate-700/60"}`}>
            <span className="text-2xl leading-none">{icon}</span>
            <span className="flex-1">
              <span className="block font-bold text-slate-100">{titel}</span>
              <span className="block text-xs text-slate-400">{unter}</span>
            </span>
            <span className={`text-lg ${offen === key ? "text-amber-300" : "text-slate-500"}`}>{offen === key ? "▲" : "▼"}</span>
          </button>
          {offen === key && (
            <Card className="mt-2">
              {key === "profil" && (<>
        {imGast ? (
          <>
            <p className="text-sm font-bold text-sky-300 mb-1">Du siehst gerade: {gastName}</p>
            <p className="text-xs text-slate-400 mb-3">Gast-Daten können nur angeschaut, nicht geändert werden.</p>
            <button onClick={onGastBeenden}
              className="w-full rounded-xl bg-sky-400 text-slate-950 font-bold py-3 active:bg-sky-300">Zurück zu meinen Daten</button>
          </>
        ) : (
          <>
            <p className="text-xs text-slate-400 mb-3">Sicherungsdatei eines Freundes laden und seine Motoren, Zeiten und Wartungsstände anschauen. Deine eigenen Daten bleiben unverändert.</p>
            {gastMsg && <p className="text-sm font-semibold text-sky-300 mb-2">{gastMsg}</p>}
            <label className="block mb-2">
              <input type="file" accept="application/json,.json,.txt" className="hidden"
                onChange={(e) => {
                  const datei = e.target.files && e.target.files[0];
                  if (!datei) return;
                  const leser = new FileReader();
                  leser.onload = () => {
                    try {
                      const roh = String(leser.result || "");
                      const von = roh.indexOf("{"), bis = roh.lastIndexOf("}");
                      const geparst = JSON.parse(roh.slice(von, bis + 1));
                      if (!geparst || !Array.isArray(geparst.autos) || !Array.isArray(geparst.motoren)) throw new Error("ungültig");
                      const name = String(datei.name).replace(/\.(json|txt)$/i, "").replace(/^nitro-service-backup-?/i, "").trim();
                      onGastLaden(geparst, name || "Gast");
                    } catch (err) {
                      setGastMsg("Das sieht nicht wie eine gültige Sicherungsdatei aus.");
                      setTimeout(() => setGastMsg(""), 5000);
                    }
                  };
                  leser.readAsText(datei);
                  e.target.value = "";
                }} />
              <span className="block w-full text-center rounded-xl bg-sky-400 text-slate-950 font-bold py-3 active:bg-sky-300">📂 Gast-Profil öffnen</span>
            </label>
            <label className="block">
              <span className="block text-xs text-slate-400 mb-1">Oder gesicherten Text einfügen:</span>
              <textarea rows={2} className={`${inputCls} text-xs`} value={gastText} placeholder='{"activeAutoId":...}'
                onChange={(e) => setGastText(e.target.value)} />
            </label>
            <button onClick={() => {
                try {
                  const roh = gastText.replace(/```/g, "").trim();
                  const von = roh.indexOf("{"), bis = roh.lastIndexOf("}");
                  const geparst = JSON.parse(roh.slice(von, bis + 1));
                  if (!geparst || !Array.isArray(geparst.autos) || !Array.isArray(geparst.motoren)) throw new Error("ungültig");
                  setGastText("");
                  onGastLaden(geparst, "Gast");
                } catch (err) {
                  setGastMsg("Das sieht nicht wie eine gültige Sicherung aus.");
                  setTimeout(() => setGastMsg(""), 5000);
                }
              }}
              className="w-full rounded-xl border border-sky-400 text-sky-300 font-bold py-2 text-sm mt-2 active:bg-sky-400/10">Text als Gast öffnen</button>
          </>
        )}
              </>)}
              {key === "sicht" && (<>
        <p className="text-xs text-slate-400 mb-3">Erinnerung im Dashboard – erscheint nach der eingestellten Litermenge und verschwindet nach dem Bestätigen.</p>
        {[["kerze", "Kerze prüfen alle"], ["kruemmer", "Krümmerdichtung alle"]].map(([key, label]) => (
          <div key={key} className="flex items-center justify-between gap-2 mb-2">
            <span className="text-sm font-semibold text-slate-200">{label}</span>
            <div className="flex items-center gap-2 shrink-0">
              <input inputMode="decimal" className={`${inputCls} w-24 text-center`}
                defaultValue={String((fullData.pruef && fullData.pruef[key]) !== undefined ? fullData.pruef[key] : (key === "kerze" ? 1 : 2)).replace(".", ",")}
                onBlur={(e) => up((d) => ({ pruef: { ...(d.pruef || {}), [key]: parseNum(e.target.value) } }))} />
              <span className="text-sm text-slate-300">L</span>
            </div>
          </div>
        ))}
              </>)}
              {key === "maxwerte" && (<>
        {[["fv", "Freilauf Vorne"], ["fg1", "Freilauf Gang 1"], ["hl", "Hauptlager"], ["fl", "Frontlager"], ["pl", "Pleuel"], ["kz", "Kerze"]].map(([key, label]) => (
          <div key={key} className="grid grid-cols-3 gap-2 items-center mb-2">
            <span className="text-sm font-semibold text-slate-200">{label}</span>
            <label className="text-xs text-slate-400">Max [L]
              <input inputMode="decimal" className={`${inputCls} mt-1`} defaultValue={String(settings[key].max).replace(".", ",")}
                onBlur={(e) => up((d) => ({ settings: { ...d.settings, [key]: { ...d.settings[key], max: parseNum(e.target.value) } } }))} />
            </label>
            <label className="text-xs text-slate-400">Gelb ab Rest [L]
              <input inputMode="decimal" className={`${inputCls} mt-1`} defaultValue={String(settings[key].gelb).replace(".", ",")}
                onBlur={(e) => up((d) => ({ settings: { ...d.settings, [key]: { ...d.settings[key], gelb: parseNum(e.target.value) } } }))} />
            </label>
          </div>
        ))}
              </>)}
              {key === "sicherung" && (<>
        {backupMsg && <p className="text-sm font-semibold text-amber-300 mb-2">{backupMsg}</p>}
        <button onClick={() => {
            const ok = doBackup();
            setBackupMsg(ok ? "✓ Sicherungsdatei heruntergeladen!" : "Download nicht möglich – nutze die Text-Sicherung unten.");
            setTimeout(() => setBackupMsg(""), 4000);
          }}
          className="w-full rounded-xl bg-amber-400 text-slate-950 font-bold py-3 mb-2 active:bg-amber-300">💾 Als Datei sichern</button>
        <Field label="Erinnerung an Sicherung">
          <select className={inputCls} value={String(fullData.backup && fullData.backup.intervalDays !== undefined ? fullData.backup.intervalDays : 30)}
            onChange={(e) => up((d) => ({ backup: { ...(d.backup || { lastBackupAt: null, hash: "" }), intervalDays: parseInt(e.target.value, 10) } }))}>
            <option value="7">Alle 7 Tage</option>
            <option value="30">Alle 30 Tage</option>
            <option value="90">Alle 90 Tage</option>
            <option value="0">Aus</option>
          </select>
        </Field>
        <div className="flex gap-2 mb-3">
          <button onClick={() => { setShowBackup((v) => !v); copyBackup(); }}
            className="flex-1 rounded-xl border border-amber-400 text-amber-300 font-bold py-2 text-sm active:bg-amber-400/10">Als Text kopieren</button>
        </div>
        {showBackup && (
          <label className="block mb-4 text-xs text-slate-400">Deine Sicherung (Text aufbewahren, z. B. in Notizen einfügen):
            <textarea readOnly rows={4} className={`${inputCls} mt-1 text-xs`} value={backupString}
              onFocus={(e) => e.target.select()} />
          </label>
        )}
        <label className="block mb-2">
          <input type="file" accept="application/json,.json,.txt" className="hidden"
            onChange={(e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                setRestoreText(String(reader.result || ""));
                setBackupMsg("✓ Datei geladen – jetzt unten ‚Wiederherstellen' tippen.");
                setTimeout(() => setBackupMsg(""), 5000);
              };
              reader.readAsText(file);
              e.target.value = "";
            }} />
          <span className="block w-full text-center rounded-xl border border-amber-400 text-amber-300 font-bold py-2 text-sm active:bg-amber-400/10">📂 Sicherungsdatei auswählen</span>
        </label>
        <label className="block text-xs text-slate-400">Oder gesicherten Text hier einfügen:
          <textarea rows={3} className={`${inputCls} mt-1 text-xs`} value={restoreText} placeholder='{"activeAutoId":...}'
            onChange={(e) => setRestoreText(e.target.value)} />
        </label>
        <button onClick={doRestore}
          className={`w-full rounded-xl font-bold py-3 mt-2 ${restoreArmed ? "bg-red-600 text-white" : "border border-amber-400 text-amber-300 active:bg-amber-400/10"}`}>
          {restoreArmed ? "Jetzt überschreiben" : "Wiederherstellen"}</button>
              </>)}
              {key === "tour" && (<>
        <p className="text-xs text-slate-400 mb-3">Kurze Tour durch alle Funktionen – läuft automatisch ab.</p>
        <button onClick={onTour} className="w-full rounded-xl bg-amber-400 text-slate-950 font-bold py-3 active:bg-amber-300">▶︎ Tour starten</button>
              </>)}
            </Card>
          )}

      ))}
      {!imGast && (

            onConfirm={onResetAll}
            className="w-full rounded-xl border border-red-500/50 text-red-400 font-bold py-3" />
        </div>
      )}
    </div>
  );
}
function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("start");
  const [editMotorId, setEditMotorId] = useState(null);
  const [editAutoId, setEditAutoId] = useState(null);
  const [tourOffen, setTourOffen] = useState(false);
  const [gast, setGast] = useState(null);
  const [gastName, setGastName] = useState("");
  const imGast = gast !== null;
  const [saveState, setSaveState] = useState("");
  const saveTimer = useRef(null);
  const loaded = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem("vg8-data");
        setData(raw ? normalizeData(JSON.parse(raw)) : seedData());
      } catch {
        setData(seedData());
      }
      loaded.current = true;
    })();
  }, []);

  useEffect(() => {
    if (!data || !loaded.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        localStorage.setItem("vg8-data", JSON.stringify(data));
        setSaveState("Gespeichert");
        setTimeout(() => setSaveState(""), 1500);
      } catch {
        setSaveState("Speichern fehlgeschlagen");
      }
    }, 500);
  }, [data]);

  if (!data) {
    return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-slate-400">Lade Daten…</div>;
  }

  const anzeige = imGast ? gast : data;
  const { autos, motoren, fahrten, settings } = anzeige;
  // up akzeptiert ein Objekt ODER eine Funktion (d) => patch – immer auf aktuellem Stand
  const up = (patch) => {
    if (imGast) return; // Gastprofil ist nur lesbar
    setData((d) => ({ ...d, ...(typeof patch === "function" ? patch(d) : patch) }));
  };

  const doBackup = () => {
    try {
      const json = JSON.stringify(data);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nitro-service-backup-" + today() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      up((d) => ({ backup: { intervalDays: d.backup && d.backup.intervalDays !== undefined ? d.backup.intervalDays : 30, lastBackupAt: new Date().toISOString(), hash: dataHash(d) } }));
      return true;
    } catch {
      return false;
    }
  };

  const tabs = [
    ["start", "Start", "📊"], ["fahrt", "Fahrt", "⛽"], ["autos", "Autos", "🚗"], ["motoren", "Motoren", "🔧"],
    ["rang", "Rangliste", "🏁"], ["mehr", "Mehr", "⚙️"],
  ];

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100" style={{ fontFamily: "ui-sans-serif, -apple-system, system-ui, sans-serif", colorScheme: "dark" }}>
      <header className="sticky top-0 z-10 bg-gradient-to-r from-slate-950 via-blue-950 to-slate-950 border-b-2 border-amber-400 text-white px-4 py-3 flex items-baseline justify-between">
        <h1 className="font-extrabold uppercase italic tracking-wider text-lg flex items-center gap-2">🏁 Nitro Service <span className="text-xs font-bold bg-amber-400 text-slate-900 rounded-full px-2 py-0.5 not-italic">2.0</span></h1>
        <span className="text-xs text-amber-300">{saveState}</span>
      </header>
      {imGast && (
        <div className="bg-sky-500/15 border-b border-sky-400/40 px-4 py-2 flex items-center justify-between gap-2">
          <span className="text-xs font-bold text-sky-200">👤 Gast-Ansicht{gastName ? ": " + gastName : ""} · nur lesen</span>
          <button onClick={() => { setGast(null); setGastName(""); setTab("start"); setEditMotorId(null); setEditAutoId(null); }}
            className="shrink-0 text-xs font-bold rounded-xl bg-sky-400 text-slate-950 px-3 py-1.5 active:bg-sky-300">Zurück zu meinen Daten</button>
        </div>
      )}
      <main className="max-w-md mx-auto px-4 py-4 pb-28">
        {tourOffen && <TourScreen onClose={() => setTourOffen(false)} />}
        {!tourOffen && tab === "start" && <DashboardScreen autos={autos} motoren={motoren} fahrten={fahrten} settings={settings} setTab={setTab} activeAutoId={anzeige.activeAutoId} up={up} fullData={anzeige} doBackup={doBackup} />}
        {!tourOffen && tab === "fahrt" && <FahrtScreen autos={autos} motoren={motoren} fahrten={fahrten} up={up} setTab={setTab} activeAutoId={anzeige.activeAutoId} />}
        {!tourOffen && tab === "autos" && <AutosScreen autos={autos} motoren={motoren} fahrten={fahrten} settings={settings} up={up} activeAutoId={anzeige.activeAutoId} editAutoId={editAutoId} setEditAutoId={setEditAutoId} />}
        {!tourOffen && tab === "motoren" && <MotorenScreen motoren={motoren} fahrten={fahrten} settings={settings} up={up} editMotorId={editMotorId} setEditMotorId={setEditMotorId}
          activeMotorId={(autos.find((a) => a.id === anzeige.activeAutoId) || autos[0])?.motorId || null} autos={autos} />}
        {!tourOffen && tab === "rang" && <RanglisteScreen motoren={motoren} />}
        {!tourOffen && tab === "mehr" && <SettingsScreen autos={autos} motoren={motoren} settings={settings} up={up} activeAutoId={anzeige.activeAutoId}
          fullData={anzeige} onRestore={(d) => setData(normalizeData(d))} doBackup={doBackup}
          onResetAll={() => setData(seedData())} onTour={() => setTourOffen(true)}
          imGast={imGast} gastName={gastName}
          onGastLaden={(d, name) => { setGast(normalizeData(d)); setGastName(name || "Gast"); setTab("start"); setEditMotorId(null); setEditAutoId(null); }}
          onGastBeenden={() => { setGast(null); setGastName(""); setTab("start"); }} />}
      </main>
      <nav className="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-700/60 flex justify-around" style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
        {tabs.map(([key, label, icon]) => (
          <button key={key} onClick={() => { setTab(key); if (key !== "motoren") setEditMotorId(null); if (key !== "autos") setEditAutoId(null); }}
            className={`flex flex-col items-center py-2 px-2 text-xs font-semibold ${tab === key ? "text-amber-300" : "text-slate-400"}`}>
            <span className="text-xl leading-none mb-0.5">{icon}</span>{label}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
